name: eazzio_school
description: "Eazzio School - Single Mobile App for Student & Teacher Portals"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking & HTTP
  dio: ^5.7.0

  # State Management & DI
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Secure Storage
  flutter_secure_storage: ^9.2.2


  # UI / Formatting / Helpers
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_pdfview: ^1.3.4
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.4
  razorpay_flutter: ^1.4.7
  flutter_local_notifications: ^18.0.1
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.png
  android_12:
    image: assets/images/logo.png
    color: "#FFFFFF"
  fullscreen: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
